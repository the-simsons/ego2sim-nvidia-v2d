_target_: flash_chord.configuration.make_fixed_curriculum

# gmd_ft: one stage, identical to the last stage of tracking_96m_pickup_ray5decay (voc 0, hand_ray 0), used to train R.
thresholds: [1000000000]

stages:
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.0
    objective_weights:
      object_keypoints: 20.0
      hand_keypoints: 0.0
      hand_joint_pos: 0.0
      contact_wrench_support: 0.0
      missed_contact: 0.0
      unintended_contact: 0.0
      termination: -100.0
      action_rate_l2: -0.005
      action_l2: -0.002
      contact_force_l2: 0.0
      force_closure: 0.0
      object_contact: 0.0
      required_wrench: 10.0
      hand_ray: 0.0
    reset_to_first_frame_probability: 0.1
